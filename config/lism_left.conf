# Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Battery
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# RGB LED widget
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# debuging
#CONFIG_ZMK_LOG_LEVEL_DBG=y

# Charge Indicator feature
CONFIG_CHARGE_INDICATOR=y

# BLE TX power: technical certification 211-220207 (XIAO-nRF52840)
# measured up to ~8.24dBm on LE 1M PHY and passed antenna output power limits
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Increase low priority thread stack size (default 768) as a precaution
# against stack overflow with the many custom behaviors enabled.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# LisM physical layout has 48 positions (default 128)
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
